name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legalrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Seed database
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legalrag
        run: |
          python scripts/seed_tenant.py
      - name: Validate project syntax & imports
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legalrag
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: replace-with-any-32-char-random-string
        run: |
          python -c "import app.main; print('App module imported successfully')"
          echo "CI validation completed successfully"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:latest -f infra/Dockerfile .
      - name: Push image (only on main)
        if: github.ref == 'refs/heads/main'
        run: echo "Build succeeded"
