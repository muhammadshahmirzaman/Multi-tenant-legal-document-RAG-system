name: CI / eval

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'evals/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'evals/**'
      - 'pyproject.toml'

jobs:
  eval:
    name: Run evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports:
          - 6333:6333
          - 6334:6334
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/healthz; then
              echo "Qdrant is ready"
              exit 0
            fi
            echo "Waiting for Qdrant... ($i/30)"
            sleep 2
          done
          echo "Qdrant did not become ready in time"
          exit 1

      - name: Populate eval tenant data
        run: python scripts/populate_eval_data.py
        env:
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          EMBEDDING_MODEL: all-MiniLM-L6-v2

      - name: Run evaluation
        run: |
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "GROQ_API_KEY secret is not configured. Skipping evaluation to avoid build failure."
            exit 0
          fi
          python evals/run_evals.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          EMBEDDING_MODEL: all-MiniLM-L6-v2

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/*.json
            evals/*.txt
          retention-days: 7