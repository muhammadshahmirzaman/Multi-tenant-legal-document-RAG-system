version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: legal-rag-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
      - qdrant
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: legal-rag-worker
    env_file: .env
    depends_on:
      - redis
      - postgres
      - qdrant
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    volumes:
      - ./:/app

  flower:
    image: mher/flower
    container_name: legal-rag-flower
    ports:
      - "5555:5555"
    env_file: .env
    command: ["flower", "--broker=$REDIS_URL"]
    depends_on:
      - redis

  redis:
    image: redis:6.2-alpine
    container_name: legal-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    command: ["/bin/sh", "-c", "qdrant --service-config /qdrant/config.yml"]

  postgres:
    image: postgres:13-alpine
    container_name: legal-rag-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: legalrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  qdrant_storage:
  postgres_data:
